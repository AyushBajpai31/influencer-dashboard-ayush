// ========================================
// LOGIN SYSTEM
// ========================================
function checkAuth() {
    const session = JSON.parse(localStorage.getItem('dashboardSession') || 'null');
    if (!session) return false;
    
    const now = Date.now();
    if (now - session.timestamp > CONFIG.SESSION_TIMEOUT) {
        localStorage.removeItem('dashboardSession');
        return false;
    }
    
    currentUser = session.user;
    return true;
}

function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('loginError');
    
    if (username === CONFIG.LOGIN_CREDENTIALS.username && password === CONFIG.LOGIN_CREDENTIALS.password) {
        const session = { user: username, timestamp: Date.now() };
        localStorage.setItem('dashboardSession', JSON.stringify(session));
        currentUser = username;
        
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('mainContainer').style.display = 'block';
        document.getElementById('currentUsername').textContent = username;
        
        if (DATA_SOURCES.length === 0) {
            document.getElementById('configModal').classList.add('active');
        } else {
            loadAllData();
        }
    } else {
        errorEl.textContent = '❌ Invalid username or password';
        errorEl.style.display = 'block';
        setTimeout(() => { errorEl.style.display = 'none'; }, 3000);
    }
}

function handleLogout() {
    if (confirm('Are you sure you want to logout?')) {
        localStorage.removeItem('dashboardSession');
        window.location.reload();
    }
}

// ========================================
// INITIALIZATION
// ========================================
document.addEventListener('DOMContentLoaded', () => {
    if (checkAuth()) {
        document.getElementById('loginContainer').style.display = 'none';
        document.getElementById('mainContainer').style.display = 'block';
        document.getElementById('currentUsername').textContent = currentUser;
        
        if (DATA_SOURCES.length === 0) {
            document.getElementById('configModal').classList.add('active');
        } else {
            loadAllData();
        }
    }
    
    if (localStorage.getItem('sidebarCollapsed') === 'true') {
        document.getElementById('sidebar').classList.add('collapsed');
        document.getElementById('mainContainer').classList.add('sidebar-collapsed');
    }
    
    if (APPS_SCRIPT_URL) {
        document.getElementById('appsScriptUrl').value = APPS_SCRIPT_URL;
    }
});

// ========================================
// DATA SOURCE MANAGEMENT
// ========================================
function addDataSource() {
    document.getElementById('sheetNameInput').value = '';
    document.getElementById('apiKeyInput').value = '';
    document.getElementById('sheetIdInput').value = '';
    document.getElementById('configModal').classList.add('active');
}

function saveConfig() {
    const name = document.getElementById('sheetNameInput').value.trim() || 'Sheet ' + (DATA_SOURCES.length + 1);
    const apiKey = document.getElementById('apiKeyInput').value.trim();
    const sheetId = document.getElementById('sheetIdInput').value.trim();

    if (!apiKey || !sheetId) {
        alert('Please enter both API Key and Sheet ID');
        return;
    }

    const source = { id: Date.now().toString(), name, apiKey, sheetId, active: true };
    DATA_SOURCES.push(source);
    localStorage.setItem('dataSources', JSON.stringify(DATA_SOURCES));
    
    closeConfigModal();
    updateDataSourcesList();
    loadAllData();
}

function closeConfigModal() {
    if (DATA_SOURCES.length > 0) {
        document.getElementById('configModal').classList.remove('active');
    }
}

function removeDataSource(id) {
    if (confirm('Remove this data source?')) {
        DATA_SOURCES = DATA_SOURCES.filter(s => s.id !== id);
        localStorage.setItem('dataSources', JSON.stringify(DATA_SOURCES));
        updateDataSourcesList();
        loadAllData();
    }
}

function toggleDataSource(id) {
    const source = DATA_SOURCES.find(s => s.id === id);
    if (source) {
        source.active = !source.active;
        localStorage.setItem('dataSources', JSON.stringify(DATA_SOURCES));
        updateDataSourcesList();
        loadAllData();
    }
}

function updateDataSourcesList() {
    const list = document.getElementById('dataSourcesList');
    if (DATA_SOURCES.length === 0) {
        list.innerHTML = '<div style="color: var(--text-secondary); padding: 1rem; text-align: center;">No data sources connected yet.</div>';
        return;
    }
    
    list.innerHTML = DATA_SOURCES.map(s => `
        <div class="data-source-item ${s.active ? 'active' : ''}">
            <div>
                <strong style="color: var(--text-primary);">${s.name}</strong>
                <div style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 0.25rem;">${s.active ? '✅ Active' : '⏸️ Paused'}</div>
            </div>
            <div style="display: flex; gap: 0.5rem;">
                <button class="btn btn-secondary btn-small" onclick="toggleDataSource('${s.id}')">${s.active ? 'Pause' : 'Activate'}</button>
                <button class="btn btn-secondary btn-small" onclick="removeDataSource('${s.id}')">Remove</button>
            </div>
        </div>
    `).join('');
}

function saveAppsScriptUrl() {
    const url = document.getElementById('appsScriptUrl').value.trim();
    if (!url) {
        alert('Please enter the Apps Script URL');
        return;
    }
    APPS_SCRIPT_URL = url;
    localStorage.setItem('appsScriptUrl', url);
    alert('✅ Apps Script URL saved!');
}

// ========================================
// LOAD DATA FROM GOOGLE SHEETS
// ========================================
async function loadAllData() {
    try {
        DATA = { creators: [], campaigns: [], payments: [], analytics: [], campaignReports: [] };
        
        for (const source of DATA_SOURCES.filter(s => s.active)) {
            const creatorsData = await fetchSheetData(source.apiKey, source.sheetId, 'Creators!A:R');
            const campaignsData = await fetchSheetData(source.apiKey, source.sheetId, 'Campaigns!A:I');
            const paymentsData = await fetchSheetData(source.apiKey, source.sheetId, 'Payments!A:G');
            const analyticsData = await fetchSheetData(source.apiKey, source.sheetId, 'Analytics!A:H');
            
            try {
                const reportsData = await fetchSheetData(source.apiKey, source.sheetId, 'CampaignReports!A:H');
                DATA.campaignReports.push(...parseCampaignReports(reportsData));
            } catch (e) {
                console.log('No CampaignReports sheet found');
            }
            
            DATA.creators.push(...parseCreators(creatorsData));
            DATA.campaigns.push(...parseCampaigns(campaignsData));
            DATA.payments.push(...parsePayments(paymentsData));
            DATA.analytics.push(...parseAnalytics(analyticsData));
        }
        
        updateDashboard();
        updateCampaignReports();
        updateLastSync();
    } catch (error) {
        console.error('Error loading data:', error);
        alert('Failed to load data. Please check your API key and Sheet ID.');
    }
}

async function fetchSheetData(apiKey, sheetId, range) {
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${range}?key=${apiKey}`;
    const response = await fetch(url);
    const data = await response.json();
    return data.values || [];
}

// ========================================
// PARSE SHEET DATA
// ========================================
function parseCreators(data) {
    if (data.length <= 1) return [];
    
    const isOldStructure = data[0] && data[0].length >= 20;
    
    return data.slice(1).map(r => {
        if (isOldStructure) {
            return {
                name: r[0] || '',
                followers: parseInt(r[3]) || 0,
                tier: r[4] || '',
                pricing: parseInt(r[5]) || 0,
                contact: r[6] || '',
                category: r[7] || '',
                avgReach: parseInt(r[8]) || 0,
                status: r[9] || '',
                product: r[10] || '',
                gender: r[11] || '',
                productStatus: r[12] || '',
                instagramLink: r[13] || '',
                youtubeLink: r[14] || '',
                facebookLink: r[15] || '',
                email: r[16] || '',
                notes: r[18] || ''
            };
        } else {
            return {
                name: r[0] || '',
                followers: parseInt(r[1]) || 0,
                tier: r[2] || '',
                pricing: parseInt(r[3]) || 0,
                contact: r[4] || '',
                category: r[5] || '',
                avgReach: parseInt(r[6]) || 0,
                status: r[7] || '',
                product: r[8] || '',
                gender: r[9] || '',
                productStatus: r[10] || '',
                instagramLink: r[11] || '',
                youtubeLink: r[12] || '',
                facebookLink: r[13] || '',
                email: r[14] || '',
                notes: r[15] || ''
            };
        }
    });
}

function parseCampaigns(data) {
    return data.length <= 1 ? [] : data.slice(1).map(r => ({
        brand: r[0] || '',
        product: r[1] || '',
        creatorCount: parseInt(r[2]) || 0,
        budget: parseInt(r[3]) || 0,
        spent: parseInt(r[4]) || 0,
        posts: parseInt(r[5]) || 0,
        status: r[6] || '',
        startDate: r[7] || '',
        endDate: r[8] || ''
    }));
}

function parsePayments(data) {
    return data.length <= 1 ? [] : data.slice(1).map(r => ({
        creator: r[0] || '',
        campaign: r[1] || '',
        amount: parseInt(r[2]) || 0,
        status: r[3] || '',
        dueDate: r[4] || '',
        paymentDate: r[5] || '',
        method: r[6] || ''
    }));
}

function parseAnalytics(data) {
    return data.length <= 1 ? [] : data.slice(1).map(r => ({
        campaign: r[0] || '',
        views: parseInt(r[1]) || 0,
        impressions: parseInt(r[2]) || 0,
        spend: parseInt(r[3]) || 0,
        cpm: parseFloat(r[4]) || 0,
        creators: parseInt(r[5]) || 0,
        avgReach: parseInt(r[6]) || 0,
        date: r[7] || ''
    }));
}

function parseCampaignReports(data) {
    return data.length <= 1 ? [] : data.slice(1).map(r => ({
        uploadDate: r[0] || '',
        name: r[1] || '',
        profileLink: r[2] || '',
        postLink: r[3] || '',
        pricing: parseInt(r[4]) || 0,
        postingMonth: r[5] || '',
        contactNo: r[6] || '',
        product: r[7] || ''
    }));
}

// ========================================
// PRODUCT STATUS HELPERS (WITH DROP + NOT ASSIGNED)
// ========================================
function parseProductStatus(statusString) {
    const statuses = {};
    if (!statusString) return statuses;
    
    statusString.split(',').forEach(item => {
        const [product, status] = item.split(':');
        if (product && status) {
            statuses[product.trim()] = status.trim();
        }
    });
    return statuses;
}

function getProductStatusBadge(status) {
    const statusMap = {
        'Briefed': 'product-briefed',
        'Content Ready': 'product-content-ready',
        'Posted': 'product-posted',
        'Hold': 'product-hold',
        'Drop': 'product-drop'  // NEW: Added Drop status
    };
    
    // If status not recognized or empty, show "Not Assigned"
    const className = statusMap[status] || 'product-not-assigned';
    const displayStatus = status || 'Not Assigned';  // NEW: Smart default
    
    return `<span class="badge ${className}">${displayStatus}</span>`;
}

function getStatusBadge(status) {
    const statusMap = {
        'Locked': 'status-locked',
        'Shipped': 'status-shipped',
        'Pending': 'status-pending',
        'Negotiation': 'status-negotiation',
        'Drop': 'status-drop',
        'Active': 'badge-success',
        'Paid': 'badge-success',
        'Overdue': 'badge-danger',
        'Completed': 'badge-primary'
    };
    return `<span class="badge ${statusMap[status] || 'badge-secondary'}">${status}</span>`;
}

function calculateProductProgress(productStatus, products) {
    if (!productStatus || !products) return 0;
    
    const productArray = products.split(',').map(p => p.trim());
    const statusObj = parseProductStatus(productStatus);
    
    const completedStatuses = ['Posted'];
    const completed = productArray.filter(p => 
        completedStatuses.includes(statusObj[p])
    ).length;
    
    return productArray.length > 0 ? (completed / productArray.length) * 100 : 0;
}

// ========================================
// UPDATE DASHBOARD (WITH FIXED CALCULATIONS)
// ========================================
function updateDashboard() {
    const selectedMonth = document.getElementById('monthFilter').value;
    
    let filteredCreators = DATA.creators;
    let filteredPayments = DATA.payments;
    
    // Apply month filter if needed (you can enhance this)
    if (selectedMonth !== 'all') {
        // Add month filtering logic based on your data structure
    }
    
    // 1. TOTAL CREATORS
    document.getElementById('totalCreators').textContent = filteredCreators.length;
    document.getElementById('totalCreatorsDetail').textContent = 'All creators in database';
    
    // 2. POST COUNT
    const postCountByProduct = {};
    filteredCreators.forEach(creator => {
        if (creator.productStatus && creator.product) {
            const statuses = parseProductStatus(creator.productStatus);
            const products = creator.product.split(',').map(p => p.trim());
            
            products.forEach(product => {
                if (statuses[product] === 'Posted') {
                    postCountByProduct[product] = (postCountByProduct[product] || 0) + 1;
                }
            });
        }
    });
    
    const totalPosted = Object.values(postCountByProduct).reduce((sum, count) => sum + count, 0);
    document.getElementById('postCount').textContent = totalPosted;
    
    const productBreakdown = Object.entries(postCountByProduct)
        .map(([product, count]) => `${product}: ${count}`)
        .join(', ') || 'No posts yet';
    document.getElementById('postCountDetail').textContent = productBreakdown;
    
    // 3. PENDING CREATORS
    const pendingCreators = filteredCreators.filter(creator => {
        if (!creator.productStatus || !creator.product) return true;
        
        const statuses = parseProductStatus(creator.productStatus);
        const products = creator.product.split(',').map(p => p.trim());
        
        return products.some(product => statuses[product] !== 'Posted');
    });
    
    document.getElementById('pendingCreators').textContent = pendingCreators.length;
    
    // 4. TOTAL SPEND - FROM PAYMENTS SHEET (FIX #1)
    const paidPayments = filteredPayments.filter(p => p.status === 'Paid');
    const totalSpend = paidPayments.reduce((sum, p) => sum + (p.amount || 0), 0);
    
    document.getElementById('totalSpend').textContent = `₹${totalSpend.toLocaleString()}`;
    document.getElementById('totalSpendDetail').textContent = `${paidPayments.length} payments made`;
    
    // 5. CPM - FROM ANALYTICS SHEET (FIX #2)
    const cpmValues = DATA.analytics
        .map(a => parseFloat(a.cpm) || 0)
        .filter(cpm => cpm > 0);
    
    const avgCPM = cpmValues.length > 0 
        ? cpmValues.reduce((sum, val) => sum + val, 0) / cpmValues.length 
        : 0;
    
    document.getElementById('cpmValue').textContent = `₹${avgCPM.toFixed(2)}`;
    
    // Update other components
    updateCreatorsTable();
    updateCampaignsTable();
    updatePaymentsTable();
    updateAnalyticsTable();
    updateCharts();
    updateLockedCreatorsActivity();
    updateDataSourcesList();
}
